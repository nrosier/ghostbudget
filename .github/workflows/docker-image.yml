name: Docker Build and Push

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The image cannot work this out for itself: .dockerignore excludes .git/ and
      # the image has no git binary, so the commit and the build time are stamped in
      # as build args. RFC 3339 in UTC, which is what the OCI `created` annotation
      # and src/config/version.js both expect.
      - name: Stamp the build
        id: stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Build into the local daemon rather than straight to the registry. The
      # previous workflow pushed :latest in a single step with no scan, so the
      # Docker Security Scan job in security.yml — which builds its own throwaway
      # image — could only report a vulnerability that had already shipped.
      - name: Build image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          no-cache: true
          tags: ghostbudget:candidate
          build-args: |
            GHOSTBUDGET_COMMIT=${{ github.sha }}
            GHOSTBUDGET_BUILT_AT=${{ steps.stamp.outputs.built_at }}

      - name: Scan image before pushing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ghostbudget:candidate'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      # An SBOM for the image that is about to be pushed, from the same local image the
      # gate above just passed — so what is inventoried is exactly what ships, and an
      # image that failed the gate never gets an SBOM published for it.
      #
      # This is a separate step rather than build-push-action's native `sbom: true`
      # because that only attaches an attestation when buildx pushes the manifest
      # itself. This workflow deliberately builds with `load: true` and pushes with
      # plain `docker push` further down, so that the scan finishes before registry
      # credentials enter the environment. A standalone artifact is what fits that
      # ordering; keeping the ordering matters more than having the SBOM in-manifest.
      #
      # CycloneDX rather than SPDX: Trivy emits it natively, so no second tool is
      # pinned, and it is what `trivy sbom` can be pointed back at to re-scan the
      # inventory later without the image.
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ghostbudget:candidate'
          scan-type: 'image'
          format: 'cyclonedx'
          scanners: 'vuln'
          output: 'sbom.cyclonedx.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 90

      # Login happens after the scan, so registry credentials are not present in
      # the environment while third-party build and scan code is running.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push the scanned image
        env:
          REPO: ${{ secrets.DOCKERHUB_USERNAME }}/ghostbudget
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker tag ghostbudget:candidate "$REPO:latest"
          docker tag ghostbudget:candidate "$REPO:$SHA"
          docker push "$REPO:latest"
          docker push "$REPO:$SHA"
