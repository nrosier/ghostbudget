name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run linting
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # See package.json: install scripts are denied by default, and better-sqlite3
      # is then built by name because @actual-app/api loads it natively.
      - name: Install dependencies
        run: npm run install:ci

      # Coverage rather than a bare `npm test`, because the thresholds in
      # jest.config.js only engage when coverage is collected. Without this the
      # gate exists in configuration and never runs anywhere.
      - name: Run tests with coverage thresholds
        run: npm run test:coverage
